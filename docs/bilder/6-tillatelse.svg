<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Skisse: Claude spør om lov</title>
  <rect width="640" height="250" rx="14" fill="#f5f5f4"/>
  <rect x="30" y="20" width="580" height="190" rx="12" fill="#fff" stroke="#d6d3d1"/>
  <text x="50" y="50" font-size="13" font-weight="700" fill="#1c1917">Claude wants to run a command</text>
  <rect x="50" y="62" width="540" height="34" rx="6" fill="#1c1917"/>
  <text x="62" y="84" font-size="12" fill="#e7e5e4" font-family="Consolas, Menlo, monospace">git clone https://github.com/eili/hjemme-app.git</text>
  <text x="50" y="118" font-size="12" fill="#57534e">Henter din kopi av appen til datamaskinen.</text>

  <rect x="50" y="140" width="90" height="32" rx="8" fill="#1c1917" stroke="#e11d48" stroke-width="2.5"/>
  <text x="95" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Allow</text>
  <rect x="152" y="140" width="150" height="32" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="227" y="161" text-anchor="middle" font-size="13" fill="#1c1917">Always allow</text>
  <rect x="314" y="140" width="80" height="32" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="354" y="161" text-anchor="middle" font-size="13" fill="#1c1917">Deny</text>
  <circle cx="38" cy="156" r="11" fill="#e11d48"/><text x="38" y="160.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">!</text>

  <text x="30" y="236" font-size="11" fill="#a8a29e">Forenklet skisse. Les den korte forklaringen, og trykk «Allow» når det stemmer med det Claude sa den skulle gjøre.</text>
</svg>
