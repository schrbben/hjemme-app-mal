<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Skisse: legg appen til på Hjem-skjermen på iPhone</title>
  <rect width="640" height="460" rx="14" fill="#f5f5f4"/>

  <!-- Telefon 1: Safari med Del-knappen -->
  <rect x="24" y="20" width="180" height="380" rx="28" fill="#1c1917"/>
  <rect x="32" y="28" width="164" height="364" rx="22" fill="#fff"/>
  <rect x="44" y="52" width="140" height="22" rx="8" fill="#f2f2f7"/>
  <text x="114" y="67" text-anchor="middle" font-size="10" fill="#3c3c43">hjemme-app.vercel.app</text>
  <rect x="44" y="86" width="140" height="240" rx="6" fill="#f8fafc"/>
  <text x="114" y="200" text-anchor="middle" font-size="12" fill="#94a3b8">Appen</text>
  <rect x="32" y="340" width="164" height="52" fill="#f9f9f9"/>
  <rect x="104" y="350" width="20" height="22" rx="3" fill="none" stroke="#007aff" stroke-width="2.4"/>
  <path d="M114 344 v16 M108 350 l6 -6 l6 6" fill="none" stroke="#007aff" stroke-width="2.4"/>
  <circle cx="144" cy="362" r="11" fill="#e11d48"/><text x="144" y="366.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="114" y="422" text-anchor="middle" font-size="12" fill="#44403c">Trykk Del-knappen</text>

  <!-- Telefon 2: Delingsark -->
  <rect x="230" y="20" width="180" height="380" rx="28" fill="#1c1917"/>
  <rect x="238" y="28" width="164" height="364" rx="22" fill="#f2f2f7"/>
  <rect x="246" y="150" width="148" height="34" rx="8" fill="#fff"/>
  <text x="256" y="172" font-size="11" fill="#000">Kopier</text>
  <rect x="246" y="190" width="148" height="34" rx="8" fill="#fff"/>
  <text x="256" y="212" font-size="11" fill="#000">Legg til bokmerke</text>
  <rect x="246" y="230" width="148" height="34" rx="8" fill="#fff" stroke="#e11d48" stroke-width="2.5"/>
  <text x="256" y="252" font-size="11" font-weight="700" fill="#000">Legg til på Hjem-skjerm</text>
  <rect x="246" y="270" width="148" height="34" rx="8" fill="#fff"/>
  <text x="256" y="292" font-size="11" fill="#000">Merk opp</text>
  <circle cx="404" cy="247" r="11" fill="#e11d48"/><text x="404" y="251.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="320" y="422" text-anchor="middle" font-size="12" fill="#44403c">Bla ned i listen</text>

  <!-- Telefon 3: Legg til -->
  <rect x="436" y="20" width="180" height="380" rx="28" fill="#1c1917"/>
  <rect x="444" y="28" width="164" height="364" rx="22" fill="#f2f2f7"/>
  <text x="456" y="62" font-size="11" fill="#007aff">Avbryt</text>
  <rect x="548" y="48" width="54" height="22" rx="6" fill="none" stroke="#e11d48" stroke-width="2.5"/>
  <text x="575" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#007aff">Legg til</text>
  <circle cx="590" cy="88" r="11" fill="#e11d48"/><text x="590" y="92.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <rect x="452" y="104" width="148" height="56" rx="8" fill="#fff"/>
  <rect x="460" y="112" width="40" height="40" rx="9" fill="#7c3aed"/>
  <text x="508" y="136" font-size="12" fill="#000">Hjemme</text>
  <rect x="452" y="170" width="148" height="40" rx="8" fill="#fff" stroke="#e11d48" stroke-width="2.5"/>
  <text x="460" y="194" font-size="10" fill="#000">Åpne som nettapp</text>
  <rect x="566" y="181" width="28" height="17" rx="8.5" fill="#34c759"/>
  <circle cx="585" cy="189.5" r="7" fill="#fff"/>
  <circle cx="446" cy="222" r="11" fill="#e11d48"/><text x="446" y="226.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="526" y="422" text-anchor="middle" font-size="12" fill="#44403c">Bryteren på, «Legg til»</text>

  <text x="24" y="448" font-size="11" fill="#a8a29e">Forenklet skisse. Bryteren «Åpne som nettapp» finnes fra iOS 26 – på eldre iPhoner er den ikke der, og da er alt i orden.</text>
</svg>
