<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Skisse: lag din egen kopi i Vercel</title>
  <rect width="640" height="400" rx="14" fill="#f5f5f4"/>
  <rect x="20" y="16" width="600" height="368" rx="10" fill="#fff" stroke="#d6d3d1"/>
  <rect x="20" y="16" width="600" height="32" rx="10" fill="#e7e5e4"/>
  <rect x="20" y="36" width="600" height="12" fill="#e7e5e4"/>
  <circle cx="40" cy="32" r="5" fill="#f87171"/><circle cx="56" cy="32" r="5" fill="#fbbf24"/><circle cx="72" cy="32" r="5" fill="#4ade80"/>
  <text x="320" y="37" text-anchor="middle" font-size="12" fill="#57534e">vercel.com/new/clone</text>

  <text x="48" y="82" font-size="20" font-weight="700" fill="#000">You're almost done.</text>
  <text x="48" y="102" font-size="12" fill="#78716c">Please follow the steps to configure your Project and deploy it.</text>

  <rect x="48" y="122" width="544" height="236" rx="10" fill="#fff" stroke="#e7e5e4"/>
  <text x="68" y="150" font-size="15" font-weight="700" fill="#000">Create Git Repository</text>
  <text x="68" y="170" font-size="12" fill="#78716c">To ensure you can easily update your project after deploying it, a Git repository must be created.</text>

  <text x="68" y="200" font-size="12" fill="#44403c">Git Scope</text>
  <rect x="68" y="208" width="220" height="30" rx="6" fill="#fff" stroke="#d6d3d1"/>
  <circle cx="86" cy="223" r="7" fill="#1c1917"/>
  <text x="100" y="228" font-size="13" fill="#000">eili   (ditt GitHub-navn)</text>
  <text x="300" y="200" font-size="12" fill="#44403c">Repository Name</text>
  <rect x="300" y="208" width="270" height="30" rx="6" fill="#fff" stroke="#d6d3d1"/>
  <text x="312" y="228" font-size="13" fill="#000">hjemme-app</text>

  <rect x="68" y="258" width="18" height="18" rx="4" fill="#000" stroke="#e11d48" stroke-width="2.5"/>
  <path d="M71 267 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.4"/>
  <text x="96" y="272" font-size="13" fill="#000">Create private Git Repository</text>
  <circle cx="300" cy="267" r="11" fill="#e11d48"/><text x="300" y="271.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>

  <rect x="68" y="300" width="502" height="36" rx="8" fill="#000" stroke="#e11d48" stroke-width="2.5"/>
  <text x="319" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Create</text>
  <circle cx="586" cy="318" r="11" fill="#e11d48"/><text x="586" y="322.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>

  <text x="48" y="374" font-size="11" fill="#a8a29e">Forenklet skisse – det kan se litt annerledes ut. Etter «Create» bygges appen (2–3 min).</text>
</svg>
