<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Skisse: slå på varsler i Rydding</title>
  <rect width="640" height="440" rx="14" fill="#f5f5f4"/>

  <!-- Telefon 1: Innstillinger i Rydding -->
  <rect x="60" y="20" width="200" height="380" rx="30" fill="#1c1917"/>
  <rect x="68" y="28" width="184" height="364" rx="24" fill="#f8fafc"/>
  <text x="84" y="64" font-size="13" font-weight="700" fill="#0f172a">Innstillinger</text>
  <rect x="80" y="150" width="160" height="96" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="90" y="172" font-size="10" font-weight="700" fill="#1e293b">Varsler på denne telefonen</text>
  <rect x="90" y="184" width="140" height="30" rx="8" fill="#7c3aed" stroke="#e11d48" stroke-width="2.5"/>
  <text x="160" y="203" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Slå på varsler på telefonen</text>
  <text x="90" y="232" font-size="9" fill="#64748b">Send testvarsel etterpå</text>
  <circle cx="246" cy="199" r="11" fill="#e11d48"/><text x="246" y="203.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="160" y="424" text-anchor="middle" font-size="12" fill="#44403c">Rydding → ⚙ → Varsler</text>

  <!-- Telefon 2: iOS-spørsmål -->
  <rect x="380" y="20" width="200" height="380" rx="30" fill="#1c1917"/>
  <rect x="388" y="28" width="184" height="364" rx="24" fill="#cbd5e1"/>
  <rect x="402" y="150" width="156" height="118" rx="14" fill="#f2f2f7"/>
  <text x="480" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#000">«Hjemme» vil sende</text>
  <text x="480" y="191" text-anchor="middle" font-size="11" font-weight="700" fill="#000">deg varslinger</text>
  <text x="480" y="210" text-anchor="middle" font-size="9" fill="#3c3c43">Varslinger kan være tekst,</text>
  <text x="480" y="222" text-anchor="middle" font-size="9" fill="#3c3c43">lyder og symboler.</text>
  <line x1="402" y1="234" x2="558" y2="234" stroke="#c6c6c8"/>
  <line x1="480" y1="234" x2="480" y2="268" stroke="#c6c6c8"/>
  <text x="441" y="256" text-anchor="middle" font-size="11" fill="#007aff">Ikke tillat</text>
  <rect x="484" y="238" width="70" height="26" rx="6" fill="none" stroke="#e11d48" stroke-width="2.5"/>
  <text x="519" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#007aff">Tillat</text>
  <circle cx="566" cy="280" r="11" fill="#e11d48"/><text x="566" y="284.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="480" y="424" text-anchor="middle" font-size="12" fill="#44403c">Trykk «Tillat»</text>
  <text x="24" y="436" font-size="10" fill="#a8a29e">Forenklet skisse.</text>
</svg>
