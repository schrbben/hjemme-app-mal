<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Skisse: koble Claude til Supabase og Vercel</title>
  <rect width="640" height="380" rx="14" fill="#f5f5f4"/>

  <!-- Meldingsfelt med pluss-meny -->
  <text x="30" y="40" font-size="13" font-weight="700" fill="#44403c">I Claude-appen</text>
  <rect x="30" y="226" width="280" height="64" rx="12" fill="#fff" stroke="#d6d3d1"/>
  <text x="46" y="252" font-size="12" fill="#a8a29e">Skriv en melding …</text>
  <rect x="42" y="262" width="22" height="22" rx="6" fill="#fff" stroke="#e11d48" stroke-width="2.5"/>
  <text x="53" y="278" text-anchor="middle" font-size="16" fill="#1c1917">+</text>
  <circle cx="30" cy="300" r="11" fill="#e11d48"/><text x="30" y="304.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>

  <rect x="42" y="94" width="200" height="124" rx="10" fill="#fff" stroke="#d6d3d1"/>
  <text x="58" y="122" font-size="13" fill="#44403c">Add files or photos</text>
  <rect x="50" y="134" width="184" height="28" rx="6" fill="#fef2f2" stroke="#e11d48" stroke-width="2"/>
  <text x="58" y="153" font-size="13" font-weight="700" fill="#1c1917">Add connectors</text>
  <text x="58" y="184" font-size="13" fill="#44403c">Slash commands</text>
  <text x="58" y="206" font-size="11" fill="#a8a29e">(kan også hete «Connectors»)</text>
  <circle cx="250" cy="148" r="11" fill="#e11d48"/><text x="250" y="152.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>

  <!-- Katalog -->
  <rect x="330" y="56" width="280" height="290" rx="10" fill="#fff" stroke="#d6d3d1"/>
  <text x="348" y="84" font-size="14" font-weight="700" fill="#1c1917">Connectors</text>
  <rect x="348" y="96" width="244" height="26" rx="6" fill="#fafaf9" stroke="#d6d3d1"/>
  <text x="358" y="114" font-size="12" fill="#78716c">Search: supabase</text>

  <rect x="348" y="136" width="244" height="80" rx="8" fill="#fff" stroke="#e7e5e4"/>
  <rect x="360" y="150" width="30" height="30" rx="6" fill="#3ecf8e"/>
  <text x="400" y="164" font-size="13" font-weight="700" fill="#1c1917">Supabase</text>
  <text x="400" y="180" font-size="11" fill="#78716c">Manage databases …</text>
  <rect x="512" y="182" width="68" height="24" rx="6" fill="#1c1917" stroke="#e11d48" stroke-width="2.5"/>
  <text x="546" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Connect</text>
  <circle cx="600" cy="160" r="11" fill="#e11d48"/><text x="600" y="164.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>

  <rect x="348" y="226" width="244" height="80" rx="8" fill="#fff" stroke="#e7e5e4"/>
  <rect x="360" y="240" width="30" height="30" rx="6" fill="#000"/>
  <path d="M375 247 l9 16 h-18 z" fill="#fff"/>
  <text x="400" y="254" font-size="13" font-weight="700" fill="#1c1917">Vercel</text>
  <text x="400" y="270" font-size="11" fill="#78716c">Manage projects and deployments</text>
  <rect x="512" y="272" width="68" height="24" rx="6" fill="#1c1917"/>
  <text x="546" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Connect</text>

  <text x="30" y="360" font-size="11" fill="#a8a29e">Forenklet skisse. Etter «Connect» logger du inn og trykker «Authorize» eller «Allow».</text>
</svg>
