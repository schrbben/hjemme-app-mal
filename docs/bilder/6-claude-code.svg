<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Skisse: Code-fanen i Claude-appen</title>
  <rect width="640" height="400" rx="14" fill="#f5f5f4"/>
  <rect x="20" y="16" width="600" height="368" rx="10" fill="#faf9f5" stroke="#d6d3d1"/>
  <rect x="20" y="16" width="600" height="32" rx="10" fill="#e7e5e4"/>
  <rect x="20" y="36" width="600" height="12" fill="#e7e5e4"/>
  <circle cx="40" cy="32" r="5" fill="#f87171"/><circle cx="56" cy="32" r="5" fill="#fbbf24"/><circle cx="72" cy="32" r="5" fill="#4ade80"/>
  <text x="320" y="37" text-anchor="middle" font-size="12" fill="#57534e">Claude</text>

  <!-- Faner -->
  <rect x="214" y="62" width="212" height="32" rx="16" fill="#efede6"/>
  <text x="252" y="83" text-anchor="middle" font-size="13" fill="#78716c">Chat</text>
  <text x="318" y="83" text-anchor="middle" font-size="13" fill="#78716c">Cowork</text>
  <rect x="352" y="66" width="70" height="24" rx="12" fill="#fff" stroke="#e11d48" stroke-width="2.5"/>
  <text x="387" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1917">Code</text>
  <circle cx="440" cy="78" r="11" fill="#e11d48"/><text x="440" y="82.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>

  <!-- Sidemeny -->
  <rect x="20" y="48" width="130" height="336" fill="#f2f0e9"/>
  <text x="36" y="120" font-size="12" fill="#57534e">+ New session</text>
  <text x="36" y="146" font-size="12" fill="#a8a29e">Sessions</text>
  <text x="36" y="350" font-size="12" fill="#57534e">Customize</text>

  <!-- Meldingsfelt -->
  <text x="390" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#44403c">Hva skal vi lage?</text>
  <rect x="170" y="190" width="430" height="88" rx="14" fill="#fff" stroke="#d6d3d1"/>
  <text x="188" y="216" font-size="12" fill="#1c1917">Hei! Jeg vil sette opp Hjemme-appen min. Les https://github.com/</text>
  <text x="188" y="234" font-size="12" fill="#1c1917">schrbben/hjemme-app-mal/blob/main/README.md og følg delen</text>
  <text x="188" y="252" font-size="12" fill="#1c1917">«Til Claude». GitHub-brukernavnet mitt er: eili</text>
  <circle cx="586" cy="262" r="11" fill="#d97706"/><path d="M581 262 h10 m-4 -4 l4 4 l-4 4" stroke="#fff" stroke-width="2" fill="none"/>
  <circle cx="612" cy="234" r="11" fill="#e11d48"/><text x="612" y="238.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>

  <!-- Raden under -->
  <text x="178" y="306" font-size="12" fill="#57534e">Local ▾</text>
  <rect x="232" y="292" width="168" height="22" rx="6" fill="#fff" stroke="#e11d48" stroke-width="2.5"/>
  <text x="242" y="307" font-size="12" fill="#1c1917">Velg mappe: Dokumenter ▾</text>
  <circle cx="316" cy="330" r="11" fill="#e11d48"/><text x="316" y="334.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="414" y="306" font-size="12" fill="#57534e">Accept edits ▾</text>
  <text x="520" y="306" font-size="12" fill="#57534e">Modell ▾</text>

  <text x="170" y="370" font-size="11" fill="#a8a29e">Forenklet skisse – navnene kan være på engelsk og se litt annerledes ut.</text>
</svg>
